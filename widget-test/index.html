<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>客户发消息台 · 固定会话2（官网客服）</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f1f5f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .app { width: 420px; height: 640px; background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(15,23,42,.16); display: flex; flex-direction: column; overflow: hidden; }
  .head { background: #1f2937; color: #fff; padding: 14px 18px; }
  .head h1 { font-size: 15px; font-weight: 600; }
  .head .sub { font-size: 12px; opacity: .75; margin-top: 3px; }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip { font-size: 11px; background: rgba(255,255,255,.14); border-radius: 999px; padding: 2px 10px; }
  .chip.ok { background: #059669; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #f8fafc; }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .row.me .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .row.them .bubble { background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; color: #0f172a; }
  .meta { font-size: 11px; color: #64748b; margin-top: 3px; }
  .hint { font-size: 12px; color: #94a3b8; text-align: center; padding: 6px; }
  .inputbar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; background: #fff; }
  input { flex: 1; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; }
  input:focus { border-color: #2563eb; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 0 18px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>客户发消息台（模拟访客）</h1>
    <div class="sub">固定身份 v2zhanghb → 官网客服 · 会话 2，可收发（坐席/机器人回复会显示）</div>
    <div class="chips">
      <span class="chip">会话 <b id="convId">…</b></span>
      <span class="chip" id="convStatus">…</span>
      <span class="chip ok">已固定</span>
    </div>
  </div>
  <div class="msgs" id="msgs">
    <div class="hint" id="hint">正在连接会话 2…</div>
  </div>
  <div class="inputbar">
    <input id="input" placeholder="输入客户消息，回车发送…" autocomplete="off" />
    <button id="send">发送</button>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var API = 'http://localhost:3000';
  var WT = 'fPyiYpNjapiXhHfquvRsBMgU';          // 官网客服渠道 token
  var TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJzb3VyY2VfaWQiOiIzMjY0ZTcyYy0wZDJhLTRlYTgtOTZjNS0xOTMzZjI0YjRlNWEiLCJpbmJveF9pZCI6MywiZXhwIjoxODA0NDg5MjY4LCJpYXQiOjE3ODg5MzcyNjh9.ZGIoj1esq6oRnCEpX1o05O3o4kpESGq0J0yi7zbwaF4'; // 固定访客 v2zhanghb

  var msgsEl = document.getElementById('msgs');
  var hintEl = document.getElementById('hint');
  var inputEl = document.getElementById('input');
  var sendEl = document.getElementById('send');
  var convIdEl = document.getElementById('convId');
  var convStatusEl = document.getElementById('convStatus');
  var toastTimer = null;

  function toast(t) {
    var el = document.getElementById('toast');
    el.textContent = t;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  function addMsg(kind, text, who) {
    hintEl.hidden = true;
    var row = document.createElement('div');
    row.className = 'row ' + kind;
    var col = document.createElement('div');
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    col.appendChild(b);
    if (who) {
      var m = document.createElement('div');
      m.className = 'meta';
      m.textContent = who;
      col.appendChild(m);
    }
    row.appendChild(col);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function loadStatus() {
    fetch(API + '/api/v1/widget/conversations?website_token=' + WT, { headers: { 'X-Auth-Token': TOKEN } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.id) {
          convIdEl.textContent = d.id;
          convStatusEl.textContent = d.status;
        }
        hintEl.textContent = '固定发送至会话 ' + (d && d.id ? d.id : '?') + '，在坐垫端打开该会话即可看到';
      })
      .catch(function () {
        hintEl.textContent = '连接 Chatwoot 失败：请确认 localhost:3000 已启动';
      });
  }

  var seenIds = {};   // 已渲染消息 id（去重）
  var lastCount = -1;

  function senderLabel(m) {
    var s = m.sender || {};
    if (m.message_type === 0) return '访客 v2zhanghb';
    if (s.type === 'agent_bot') return '🤖 DeepSeek 机器人';
    if (s.type === 'User' || s.name) return '坐席 ' + (s.name || '');
    return '坐席';
  }

  function renderMessages(list) {
    // activity / template 系统消息不渲染
    var visible = list.filter(function (m) {
      return m.content_type !== 'activity' && m.content_type !== 'template'
        && typeof m.content === 'string' && m.content.trim();
    });
    visible.forEach(function (m) {
      if (seenIds[m.id]) return;
      seenIds[m.id] = true;
      var incoming = m.message_type === 0;
      addMsg(incoming ? 'me' : 'them', m.content, senderLabel(m));
    });
    if (visible.length !== lastCount) {
      lastCount = visible.length;
      hintEl.hidden = visible.length > 0;
    }
  }

  function loadMessages() {
    return fetch(API + '/api/v1/widget/messages?website_token=' + WT, { headers: { 'X-Auth-Token': TOKEN } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.payload) renderMessages(d.payload);
      })
      .catch(function () { /* 静默，下轮重试 */ });
  }

  function poll() {
    loadStatus();
    loadMessages();
  }

  function send() {
    var text = inputEl.value.trim();
    if (!text) return;
    sendEl.disabled = true;
    fetch(API + '/api/v1/widget/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Token': TOKEN },
      body: JSON.stringify({ website_token: WT, message: { content: text } })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) {
          toast('已发送 → 会话 2');
          inputEl.value = '';
          loadMessages();
          loadStatus();
        } else {
          toast('发送失败：' + ((res.j && res.j.error) || 'HTTP ' + (res.j && res.j.code) || ''));
        }
      })
      .catch(function () { toast('网络错误：无法连接 localhost:3000'); })
      .finally(function () { sendEl.disabled = false; inputEl.focus(); });
  }

  sendEl.addEventListener('click', send);
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  poll();                        // 首次加载：状态 + 历史消息
  setInterval(poll, 4000);       // 每 4 秒轮询新消息（含坐席/机器人回复）
})();
</script>
</body>
</html>
